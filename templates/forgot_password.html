{% extends "base_auth.html" %}
{% block title %}Lupa Password — Laprakin{% endblock %}
{% block content %}
  <h1 class="auth-title">Reset Kata Sandi</h1>
  <p class="auth-subtitle">Masukkan Username dan Nama Lengkap terdaftar untuk mengatur ulang kata sandi Anda.</p>

  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <div class="honeypot-field" aria-hidden="true">
      <input type="text" name="website" tabindex="-1" autocomplete="off" />
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" type="text" placeholder="Username Anda" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="full_name">Nama Lengkap Terdaftar</label>
      <input class="form-control" id="full_name" name="full_name" type="text" placeholder="Persis saat mendaftar" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="new_password">Kata Sandi Baru</label>
      <input class="form-control" id="new_password" name="new_password" type="password" minlength="5" placeholder="Minimal 5 karakter" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Konfirmasi Kata Sandi Baru</label>
      <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="5" placeholder="Ulangi kata sandi baru" required />
    </div>

    <button type="submit" class="btn btn-blue btn-block">Simpan Kata Sandi Baru</button>
  </form>

  <div class="auth-links">
    <a href="{{ url_for('login') }}">Kembali ke Sign in</a>
    <a href="{{ url_for('signup') }}">Daftar baru</a>
  </div>
{% endblock %}
